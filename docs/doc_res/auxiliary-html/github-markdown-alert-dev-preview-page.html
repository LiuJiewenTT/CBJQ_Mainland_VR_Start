<!DOCTYPE html>
<html>

<head>
    <title>GitHub Markdown Alert Dev Preview Page</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="/docs/doc_res/js/github-markdown-alert-reproduce.js"></script>
    <link rel="stylesheet" href="/docs/doc_res/css/github-markdown-alert.css">
</head>

<body>
    <div id="by-custom-css">
        <blockquote>
            <p>[!NOTE]</p>
            <p>This is a note.</p>
        </blockquote>
        <blockquote>
            <p>[!TIP]</p>
            <p>This is a tip.</p>
        </blockquote>
        <blockquote>
            <p>[!WARNING]</p>
            <p>This is a warning.</p>
        </blockquote>
        <blockquote>
            <p>[!CAUTION]</p>
            <p>This is a caution.</p>
        </blockquote>
        <blockquote>
            <p>[!IMPORTANT]</p>
            <p>This is an important note.</p>
        </blockquote>
    </div>

</body>
